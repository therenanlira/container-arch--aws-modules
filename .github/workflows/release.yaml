name: Release

on:
  # PRs get the same validation as a pre-merge check, but never cut a release.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  discover:
    name: Discover Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v5

      - name: List module directories
        id: list
        # A "module" is any top-level directory with at least one .tf file at
        # its root. New modules (e.g. efs_storage) are picked up automatically
        # — nothing to update here when one is added.
        run: |
          MODULES=$(for dir in */; do
            dir="${dir%/}"
            if compgen -G "$dir"/*.tf > /dev/null; then
              echo "$dir"
            fi
          done | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Modules found: $MODULES"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Modules
    runs-on: ubuntu-latest
    needs: [discover]
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.13"
          # The wrapper does not propagate terraform's real exit code to the
          # shell, which breaks -detailed-exitcode checks.
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Stub aliased providers
        # A module that declares configuration_aliases expects them from its
        # caller, so validating it standalone fails with "Provider
        # configuration not present". The stub only exists on the runner.
        run: |
          ALIASES=$(grep -rhoE 'configuration_aliases[[:space:]]*=[[:space:]]*\[[^]]*\]' *.tf 2>/dev/null \
            | grep -oE '[a-z0-9_]+\.[a-z0-9_]+' | sort -u || true)

          if [ -z "$ALIASES" ]; then
            echo "No configuration_aliases declared, nothing to stub."
            exit 0
          fi

          for entry in $ALIASES; do
            printf 'provider "%s" {\n  alias = "%s"\n}\n\n' "${entry%%.*}" "${entry##*.}"
          done > _ci_provider_aliases.tf

          echo "Stubbed:"
          cat _ci_provider_aliases.tf

      - name: Terraform Validate
        run: terraform validate

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate]
    # Only push/merge to main cuts a release; PR runs stop at validation.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so every tag is available for the version bump.
          fetch-depth: 0

      - name: Compute next version
        id: version
        # Patch bump by default. Put "#minor" or "#major" anywhere in the merge
        # commit message to bump that part instead.
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST=${LATEST:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if grep -q "#major" <<< "$COMMIT_MSG"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif grep -q "#minor" <<< "$COMMIT_MSG"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Latest: $LATEST -> New: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "major_tag=v$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor_tag=v$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.new_version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.new_version }}" \
            --generate-notes

      - name: Update floating major and minor tags
        # Keep the moving tags (e.g. v1 and v1.4) pointing at the newest
        # release, so consumers pinned to ?ref=v1 follow non-breaking updates
        # and ?ref=v1.4 follows patch updates only.
        run: |
          git tag -f "${{ steps.version.outputs.major_tag }}" "$GITHUB_SHA"
          git tag -f "${{ steps.version.outputs.minor_tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.major_tag }}" "${{ steps.version.outputs.minor_tag }}" --force
